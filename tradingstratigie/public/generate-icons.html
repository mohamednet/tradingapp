<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PWA Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .icon-preview {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 5px;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Generate PWA Icons</h1>
    <p>This tool generates placeholder icons for your PWA. Click "Generate All Icons" to create them.</p>
    
    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAll()">Download All</button>
    
    <div id="icons-container"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const canvases = {};

        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Icon symbol (chart line)
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size / 20;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const padding = size / 4;
            const chartWidth = size - (padding * 2);
            const chartHeight = size - (padding * 2);

            ctx.beginPath();
            ctx.moveTo(padding, padding + chartHeight * 0.7);
            ctx.lineTo(padding + chartWidth * 0.3, padding + chartHeight * 0.4);
            ctx.lineTo(padding + chartWidth * 0.6, padding + chartHeight * 0.6);
            ctx.lineTo(padding + chartWidth, padding + chartHeight * 0.2);
            ctx.stroke();

            // Add text for larger icons
            if (size >= 192) {
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size / 8}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('ES', size / 2, size - padding / 2);
            }

            return canvas;
        }

        function generateAllIcons() {
            const container = document.getElementById('icons-container');
            container.innerHTML = '';

            sizes.forEach(size => {
                const canvas = generateIcon(size);
                canvases[size] = canvas;

                const div = document.createElement('div');
                div.className = 'icon-preview';
                
                const label = document.createElement('div');
                label.textContent = `${size}x${size}`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(size);

                div.appendChild(canvas);
                div.appendChild(label);
                div.appendChild(downloadBtn);
                container.appendChild(div);
            });
        }

        function downloadIcon(size) {
            const canvas = canvases[size];
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function downloadAll() {
            sizes.forEach(size => {
                setTimeout(() => downloadIcon(size), size * 10);
            });
        }

        // Generate on load
        window.onload = generateAllIcons;
    </script>
</body>
</html>
